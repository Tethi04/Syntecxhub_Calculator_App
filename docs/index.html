<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel Glass Calculator | Syntecxhub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            /* Pastel Cyan-Pink-Purple Fluid Mesh Gradient */
            background: linear-gradient(135deg, #a5f3fc 0%, #c084fc 45%, #f472b6 75%, #bae6fd 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            position: relative;
            overflow: hidden;
        }

        /* 3D Floating Orbs & Shapes matching the photo */
        .orb {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: inset 2px 2px 8px rgba(255, 255, 255, 0.8), 0 10px 20px rgba(0, 0, 0, 0.05);
            z-index: 1;
        }
        .orb-top-left {
            width: 160px;
            height: 160px;
            top: 15%;
            left: 22%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(192, 132, 252, 0.2));
        }
        .orb-top-small {
            width: 80px;
            height: 80px;
            top: 18%;
            left: 36%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(165, 243, 252, 0.3));
        }
        .orb-right-pink {
            width: 70px;
            height: 70px;
            top: 36%;
            right: 22%;
            background: radial-gradient(circle at 30% 30%, #f472b6, #e11d48);
            box-shadow: 0 10px 25px rgba(244, 114, 182, 0.4);
        }
        .orb-bottom-cyan {
            width: 120px;
            height: 120px;
            bottom: 18%;
            right: 24%;
            background: radial-gradient(circle at 30% 30%, rgba(165, 243, 252, 0.9), rgba(56, 189, 248, 0.4));
        }

        /* Glassmorphic Calculator Outer Card */
        .calculator-card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.28);
            backdrop-filter: blur(30px) saturate(160%);
            -webkit-backdrop-filter: blur(30px) saturate(160%);
            width: 100%;
            max-width: 360px;
            padding: 24px;
            border-radius: 36px;
            border: 1.5dp solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.06), inset 0 1px 2px rgba(255, 255, 255, 0.6);
        }

        /* Window Dots (...) on Top-Left */
        .window-dots {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
        }
        .dot {
            width: 8px;
            height: 8px;
            background-color: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
        }

        /* Display Container */
        .display-container {
            text-align: right;
            padding: 10px 8px 24px 8px;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            word-wrap: break-word;
            word-break: break-all;
        }

        .expression {
            color: #9061F9;
            font-size: 1.25rem;
            font-weight: 500;
            min-height: 28px;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .result {
            color: #FFFFFF;
            font-size: 3rem;
            font-weight: 600;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.3);
        }

        /* Keypad Grid with subtle white inner border lines */
        .grid-layout {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            background: rgba(255, 255, 255, 0.22);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.35);
        }

        /* Grid Buttons */
        button {
            height: 62px;
            border: none;
            background: rgba(255, 255, 255, 0.05);
            color: #8B5CF6;
            font-size: 1.3rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
            outline: none;
            user-select: none;
        }

        button:active {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(0.96);
        }

        /* Number Buttons */
        .btn-num {
            color: #8B5CF6;
        }

        /* Operator & Action Buttons */
        .btn-op, .btn-action {
            color: #9333EA;
        }

        /* Bottom-Right 'Enter' Highlighted Button */
        .btn-enter {
            grid-column: span 2;
            background: rgba(165, 243, 252, 0.7);
            color: #0284C7;
            font-weight: 600;
            border-radius: 16px;
            margin: 4px;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
        }
        .btn-enter:active {
            background: rgba(165, 243, 252, 0.9);
        }

        @media (max-width: 400px) {
            .calculator-card {
                padding: 18px;
                border-radius: 28px;
            }
            button {
                height: 54px;
                font-size: 1.15rem;
            }
            .result {
                font-size: 2.4rem;
            }
        }
    </style>
</head>
<body>

    <!-- Ambient 3D Glass Orbs -->
    <div class="orb orb-top-left"></div>
    <div class="orb orb-top-small"></div>
    <div class="orb orb-right-pink"></div>
    <div class="orb orb-bottom-cyan"></div>

    <div class="calculator-card">
        <!-- Top Left Window Dots -->
        <div class="window-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <!-- Output Display -->
        <div class="display-container">
            <div class="expression" id="expression">(62 × 25) + 471</div>
            <div class="result" id="display">2021</div>
        </div>

        <!-- Grid Keypad -->
        <div class="grid-layout">
            <button class="btn-action" onclick="clearDisplay()">C</button>
            <button class="btn-action" onclick="toggleSign()">±</button>
            <button class="btn-action" onclick="appendOperator('%')">%</button>
            <button class="btn-op" onclick="appendOperator('/')">÷</button>

            <button class="btn-num" onclick="appendNumber('7')">7</button>
            <button class="btn-num" onclick="appendNumber('8')">8</button>
            <button class="btn-num" onclick="appendNumber('9')">9</button>
            <button class="btn-op" onclick="appendOperator('*')">×</button>

            <button class="btn-num" onclick="appendNumber('4')">4</button>
            <button class="btn-num" onclick="appendNumber('5')">5</button>
            <button class="btn-num" onclick="appendNumber('6')">6</button>
            <button class="btn-op" onclick="appendOperator('-')">−</button>

            <button class="btn-num" onclick="appendNumber('1')">1</button>
            <button class="btn-num" onclick="appendNumber('2')">2</button>
            <button class="btn-num" onclick="appendNumber('3')">3</button>
            <button class="btn-op" onclick="appendOperator('+')">+</button>

            <button class="btn-num" onclick="appendNumber('.')">.</button>
            <button class="btn-num" onclick="appendNumber('0')">0</button>
            <button class="btn-enter" onclick="calculate()">Enter</button>
        </div>
    </div>

    <script>
        let currentInput = '2021';
        let expressionText = '(62 × 25) + 471';
        let isNewInput = true;

        const display = document.getElementById('display');
        const expression = document.getElementById('expression');

        function appendNumber(num) {
            if (isNewInput) {
                currentInput = num;
                isNewInput = false;
            } else {
                if (num === '.' && currentInput.includes('.')) return;
                currentInput += num;
            }
            updateDisplay();
        }

        function appendOperator(op) {
            const displayOp = op === '*' ? '×' : op === '/' ? '÷' : op;
            expressionText = `${currentInput} ${displayOp}`;
            expression.innerText = expressionText;
            isNewInput = true;
        }

        function toggleSign() {
            if (currentInput !== '0') {
                currentInput = currentInput.startsWith('-') ? currentInput.slice(1) : '-' + currentInput;
                updateDisplay();
            }
        }

        function calculate() {
            try {
                let sanitizedExp = expressionText
                    .replace(/×/g, '*')
                    .replace(/÷/g, '/')
                    .replace(/−/g, '-');
                
                if (isNewInput === false) {
                    sanitizedExp += ' ' + currentInput;
                }

                let result = eval(sanitizedExp);
                expression.innerText = sanitizedExp + ' =';
                currentInput = String(Number.isInteger(result) ? result : parseFloat(result.toFixed(4)));
                updateDisplay();
                isNewInput = true;
            } catch (e) {
                currentInput = 'Error';
                updateDisplay();
                isNewInput = true;
            }
        }

        function clearDisplay() {
            currentInput = '0';
            expressionText = '';
            expression.innerText = '';
            isNewInput = true;
            updateDisplay();
        }

        function updateDisplay() {
            display.innerText = currentInput;
        }
    </script>
</body>
</html>
