<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphic Calculator | Syntecxhub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0F172A 0%, #31103F 50%, #1E1B4B 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            position: relative;
            overflow: hidden;
        }

        /* Glowing Ambient Orbs behind glass for maximum blur effect */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 1;
        }
        .orb-1 {
            width: 280px;
            height: 280px;
            background: rgba(167, 139, 250, 0.45);
            top: 10%;
            left: 20%;
        }
        .orb-2 {
            width: 260px;
            height: 260px;
            background: rgba(244, 114, 182, 0.35);
            bottom: 10%;
            right: 20%;
        }

        /* Glassmorphic Container Card */
        .calculator-card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            width: 100%;
            max-width: 380px;
            padding: 24px;
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Glass Display Container */
        .display-container {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 24px;
            text-align: right;
            margin-bottom: 20px;
            min-height: 130px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            word-wrap: break-word;
            word-break: break-all;
            box-shadow: inset 0 2px 4px 0 rgba(255, 255, 255, 0.05);
        }

        .expression {
            color: #CBD5E1;
            font-size: 1.1rem;
            min-height: 24px;
            margin-bottom: 6px;
        }

        .result {
            color: #FFFFFF;
            font-size: 2.6rem;
            font-weight: bold;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.2);
        }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        /* Glassmorphic Buttons */
        button {
            height: 68px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 20px;
            font-size: 1.35rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            user-select: none;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        button:active {
            transform: scale(0.92);
        }

        /* Number Buttons */
        .btn-num {
            background: rgba(255, 255, 255, 0.08);
            color: #FFFFFF;
        }
        .btn-num:hover {
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* Operator Buttons (+, -, ×, ÷) */
        .btn-op {
            background: rgba(167, 139, 250, 0.2);
            color: #C4B5FD;
        }
        .btn-op:hover {
            background: rgba(167, 139, 250, 0.35);
            color: #FFFFFF;
        }

        /* Action Buttons (C, ⌫) */
        .btn-action {
            background: rgba(255, 117, 151, 0.2);
            color: #FCA5A5;
        }
        .btn-action:hover {
            background: rgba(255, 117, 151, 0.35);
            color: #FFFFFF;
        }

        /* Equals Accent Button */
        .btn-equals {
            background: rgba(124, 58, 237, 0.75);
            color: #FFFFFF;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
        }
        .btn-equals:hover {
            background: rgba(124, 58, 237, 0.9);
            box-shadow: 0 6px 24px rgba(124, 58, 237, 0.6);
        }

        /* Zero button spans 2 columns */
        .btn-zero {
            grid-column: span 2;
        }

        /* Media queries for smaller mobile screens */
        @media (max-width: 400px) {
            .calculator-card {
                padding: 16px;
                border-radius: 24px;
            }
            button {
                height: 58px;
                font-size: 1.2rem;
            }
            .result {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>

    <!-- Ambient background light orbs for glass effect -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="calculator-card">
        <div class="display-container">
            <div class="expression" id="expression"></div>
            <div class="result" id="display">0</div>
        </div>

        <div class="grid-layout">
            <button class="btn-action" onclick="clearDisplay()">C</button>
            <button class="btn-action" onclick="deleteChar()">⌫</button>
            <button class="btn-op" onclick="appendOperator('/')">÷</button>
            <button class="btn-op" onclick="appendOperator('*')">×</button>

            <button class="btn-num" onclick="appendNumber('7')">7</button>
            <button class="btn-num" onclick="appendNumber('8')">8</button>
            <button class="btn-num" onclick="appendNumber('9')">9</button>
            <button class="btn-op" onclick="appendOperator('-')">-</button>

            <button class="btn-num" onclick="appendNumber('4')">4</button>
            <button class="btn-num" onclick="appendNumber('5')">5</button>
            <button class="btn-num" onclick="appendNumber('6')">6</button>
            <button class="btn-op" onclick="appendOperator('+')">+</button>

            <button class="btn-num" onclick="appendNumber('1')">1</button>
            <button class="btn-num" onclick="appendNumber('2')">2</button>
            <button class="btn-num" onclick="appendNumber('3')">3</button>
            <button class="btn-equals" onclick="calculate()">=</button>

            <button class="btn-num btn-zero" onclick="appendNumber('0')">0</button>
            <button class="btn-num" onclick="appendNumber('.')">.</button>
        </div>
    </div>

    <script>
        let currentInput = '';
        let operator = '';
        let firstOperand = null;
        let waitingForSecondOperand = false;

        const display = document.getElementById('display');
        const expression = document.getElementById('expression');

        function appendNumber(num) {
            if (waitingForSecondOperand) {
                currentInput = num;
                waitingForSecondOperand = false;
            } else {
                if (num === '.' && currentInput.includes('.')) return;
                currentInput = currentInput === '0' && num !== '.' ? num : currentInput + num;
            }
            updateDisplay();
        }

        function appendOperator(op) {
            const displayOp = op === '*' ? '×' : op === '/' ? '÷' : op;
            
            if (firstOperand === null) {
                firstOperand = parseFloat(currentInput || '0');
            } else if (operator && !waitingForSecondOperand) {
                const result = performCalculation();
                firstOperand = result;
                currentInput = String(result);
            }
            
            operator = op;
            waitingForSecondOperand = true;
            expression.innerText = `${firstOperand} ${displayOp}`;
            updateDisplay();
        }

        function calculate() {
            if (firstOperand === null || operator === '') return;

            const secondOperand = parseFloat(currentInput);
            expression.innerText = `${firstOperand} ${operator === '*' ? '×' : operator === '/' ? '÷' : operator} ${secondOperand} =`;
            
            const result = performCalculation();
            if (result === 'Cannot divide by 0') {
                display.innerText = result;
            } else {
                display.innerText = result;
                currentInput = String(result);
            }

            firstOperand = null;
            operator = '';
            waitingForSecondOperand = false;
        }

        function performCalculation() {
            const secondOperand = parseFloat(currentInput);
            if (operator === '/' && secondOperand === 0) {
                return 'Cannot divide by 0';
            }
            
            let res = 0;
            switch (operator) {
                case '+': res = firstOperand + secondOperand; break;
                case '-': res = firstOperand - secondOperand; break;
                case '*': res = firstOperand * secondOperand; break;
                case '/': res = firstOperand / secondOperand; break;
            }
            return Number.isInteger(res) ? res : parseFloat(res.toFixed(4));
        }

        function clearDisplay() {
            currentInput = '0';
            firstOperand = null;
            operator = '';
            waitingForSecondOperand = false;
            expression.innerText = '';
            updateDisplay();
        }

        function deleteChar() {
            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = '0';
            }
            updateDisplay();
        }

        function updateDisplay() {
            display.innerText = currentInput || '0';
        }
    </script>
</body>
</html>
